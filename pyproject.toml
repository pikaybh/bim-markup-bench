[project]
name = "bim-markup-bench"
version = "0.0.1"
description = "Independent, paired LLM declarative BIM markup vs IFC imperative authoring benchmark"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "ifcopenshell==0.8.4.post1",
  "openai==2.48.0",
  "python-dotenv==1.2.1",
  "jsonschema==4.25.1",
  "PyYAML==6.0.3",
  "lxml==6.0.2",
]

[tool.uv]
package = false

[tool.uv.pip]
strict = true
